    // Year
    document.getElementById('yr').textContent = new Date().getFullYear();

    // Theme - sunrise/sunset auto
    const root = document.documentElement;
    function getSunTimes(date, lat, lng) {
      const rad = Math.PI / 180;
      const dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
      const decl = -23.45 * Math.cos(rad * (360 / 365) * (dayOfYear + 10));
      const ha = Math.acos((Math.cos(90.833 * rad) - Math.sin(lat * rad) * Math.sin(decl * rad)) / (Math.cos(lat * rad) * Math.cos(decl * rad))) / rad;
      const b = 360 / 365 * (dayOfYear - 81);
      const eot = 9.87 * Math.sin(2 * b * rad) - 7.53 * Math.cos(b * rad) - 1.5 * Math.sin(b * rad);
      const noon = 720 - 4 * lng - eot;
      const offset = -date.getTimezoneOffset();
      const toDate = (m) => { const d = new Date(date); d.setHours(0, 0, 0, 0); d.setMinutes(m); return d; };
      return { sunrise: toDate(noon - ha * 4 + offset), sunset: toDate(noon + ha * 4 + offset) };
    }
    function getAutoTheme(lat, lng) { const now = new Date(); const { sunrise, sunset } = getSunTimes(now, lat, lng); return (now >= sunrise && now < sunset) ? 'light' : 'dark'; }
    const _LAT = parseFloat(localStorage.getItem('ruonalim-lat')) || 25.2;
    const _LNG = parseFloat(localStorage.getItem('ruonalim-lng')) || 55.27;
    const _manual = localStorage.getItem('ruonalim-manual');
    root.setAttribute('data-theme', _manual || getAutoTheme(_LAT, _LNG));
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('ruonalim-theme', next);
      localStorage.setItem('ruonalim-manual', next);
    });

    // Format date
    function fmtDate(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    // Render markdown-ish body (basic)
    function renderBody(text) {
      if (!text) return '';
      return text
        .split('\n')
        .map(line => {
          if (line.startsWith('## ')) return `<h2>${line.slice(3)}</h2>`;
          if (line.startsWith('### ')) return `<h3>${line.slice(4)}</h3>`;
          if (line.startsWith('# ')) return `<h2>${line.slice(2)}</h2>`;
          if (line.startsWith('> ')) return `<blockquote>${line.slice(2)}</blockquote>`;
          if (line.trim() === '') return '';
          return `<p>${line}</p>`;
        })
        .join('');
    }

    // Open article
    const overlay   = document.getElementById('article-overlay');
    const backBtn   = document.getElementById('article-back');
    const artTitle  = document.getElementById('art-title');
    const artTopic  = document.getElementById('art-topic');
    const artDate   = document.getElementById('art-date');
    const artBody   = document.getElementById('art-body');

    // Share buttons
    document.getElementById('share-linkedin').addEventListener('click', () => {
      const url = encodeURIComponent(window.location.href);
      window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${url}`, '_blank', 'width=600,height=500');
    });
    document.getElementById('share-x').addEventListener('click', () => {
      const url = encodeURIComponent(window.location.href);
      const text = encodeURIComponent(artTitle.textContent + ' — ruonalim.');
      window.open(`https://x.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'width=600,height=400');
    });
    document.getElementById('share-copy').addEventListener('click', () => {
      const btn = document.getElementById('share-copy');
      navigator.clipboard.writeText(window.location.href).then(() => {
        btn.classList.add('copied');
        setTimeout(() => btn.classList.remove('copied'), 1500);
      });
    });

    function openArticle(post) {
      artTitle.textContent = post.title;
      artTopic.textContent = post.topic;
      artDate.textContent  = fmtDate(post.date);
      artBody.innerHTML    = renderBody(post.body);
      overlay.classList.add('open');
      overlay.scrollTop = 0;
      document.body.style.overflow = 'hidden';
      history.pushState({ postId: post.id }, '', `?post=${post.id}`);
    }

    function closeArticle() {
      overlay.classList.remove('open');
      document.body.style.overflow = '';
      history.pushState({}, '', '/writing');
    }

    backBtn.addEventListener('click', closeArticle);
    overlay.addEventListener('keydown', e => { if (e.key === 'Escape') closeArticle(); });

    // Render grid
    function renderGrid(posts) {
      const grid = document.getElementById('writing-grid');

      if (!posts.length) {
        grid.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'state-wrap';
        wrap.innerHTML = `<div class="state-label">Coming soon</div><div class="state-msg">No posts published yet.</div>`;
        grid.appendChild(wrap);
        return;
      }

      grid.innerHTML = posts.map((post, i) => `
        <div class="post-card" data-index="${i}">
          <div class="post-meta">
            ${post.topic ? `<span class="post-topic">${post.topic}</span><div class="post-dot"></div>` : ''}
            <span class="post-date">${fmtDate(post.date)}</span>
          </div>
          <div class="post-title">${post.title}</div>
          ${post.body ? `<div class="post-excerpt">${post.body.slice(0, 200).replace(/[#>]/g, '')}</div>` : ''}
          <div class="post-read">
            Read
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h8M6 2l4 4-4 4"/></svg>
          </div>
        </div>
      `).join('');

      // Attach click handlers
      grid.querySelectorAll('.post-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.dataset.index);
          openArticle(posts[idx]);
        });
      });
    }

    // Fetch posts
    async function loadPosts() {
      try {
        const res = await fetch('/posts.json');
        if (!res.ok) throw new Error(`${res.status}`);
        const posts = await res.json();
        renderGrid(posts);

        // Check URL for direct post link
        const params = new URLSearchParams(location.search);
        const pid = params.get('post');
        if (pid) {
          const post = posts.find(p => p.id === pid);
          if (post) openArticle(post);
        }
      } catch (e) {
        const grid = document.getElementById('writing-grid');
        grid.innerHTML = '';
        const wrap = document.createElement('div');
        wrap.className = 'state-wrap';
        wrap.innerHTML = `<div class="state-label">Error</div><div class="state-msg">Couldn't load posts.</div>`;
        grid.appendChild(wrap);
        console.error(e);
      }
    }

    loadPosts();
  </script>
</body>
</html>
